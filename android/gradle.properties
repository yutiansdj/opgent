# 内存只有 ~3G 可用，按环境说明控制在 1536m
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# Kotlin 编译器跑在 Gradle 进程内，避免额外守护进程
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true

# arm64 宿主：aapt2 官方只有 x86_64 版，这里指向 qemu 包装脚本
android.aapt2FromMavenOverride=/opt/android-sdk/wrap/aapt2
